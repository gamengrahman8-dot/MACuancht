<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MACuan Cht</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:rgba(6,12,8,.86);--line:rgba(74,222,128,.18);--ink:#4ade80;--mute:#2fa862;--a:#16a34a;--b:#86efac;--me:linear-gradient(135deg,#052e16,#14532d);--r:18px;--fs:15px}
*{box-sizing:border-box;margin:0;font-family:Vazirmatn,Tahoma,sans-serif}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
button,input,textarea{font:inherit;color:inherit;border:0;outline:0}
button{cursor:pointer;background:none}
.hide{display:none!important}
.glass{background:var(--panel);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line)}
.btn{background:var(--me);padding:11px 20px;border-radius:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3)}
a.btn{display:inline-block;text-decoration:none;color:inherit;text-align:center}
.btn.g{background:rgba(255,255,255,.1);box-shadow:none}
input,textarea{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:14px;padding:11px 14px;width:100%}
input:focus,textarea:focus{border-color:var(--a)}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--a)}
.av{width:44px;height:44px;border-radius:50%;background:var(--me) center/cover;display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden}
.av.lg{width:96px;height:96px;font-size:34px;cursor:pointer}
#login{height:100%;display:grid;place-items:center;text-align:center;padding:24px}
#login .card{padding:44px 32px;border-radius:28px;max-width:380px;width:100%}
.logo{font-size:44px;font-weight:800;letter-spacing:-1px;direction:ltr;background:linear-gradient(90deg,#bbf7d0,#4ade80 50%,#22c55e);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font-size:14px;font-weight:300;color:var(--mute);letter-spacing:6px;-webkit-text-fill-color:var(--mute)}
#login p{color:var(--mute);margin:18px 0 28px}
#gbtn{background:#fff;color:#222;width:100%;padding:13px;border-radius:14px;font-weight:600;display:flex;gap:10px;justify-content:center;align-items:center}
#app{height:100%;display:flex}
#side{width:360px;max-width:100%;display:flex;flex-direction:column;border-inline-end:1px solid var(--line)}
#tabs{display:flex;gap:6px;padding:10px 12px 0;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:1 0 auto;padding:8px 12px;border-radius:12px;font-size:12.5px;background:rgba(255,255,255,.09);white-space:nowrap}
#tabs .on{background:var(--me)}
.top{display:flex;gap:8px;align-items:center;padding:10px 12px;position:relative}
.ib{width:40px;height:40px;border-radius:12px;font-size:20px;flex:none}
.ib:hover{background:rgba(255,255,255,.1)}
#list,.pane{flex:1;overflow:auto;min-height:0}
.pane{padding:16px;display:flex;flex-direction:column;gap:12px}
.pane .sec{padding:4px 0}
.row{display:flex;gap:12px;align-items:center;padding:11px 14px;cursor:pointer}
.row{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.row:hover,.row.on{background:color-mix(in srgb,var(--a) 24%,transparent)}
.row b{display:block;font-size:15px}.row span{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:230px}
.sec{padding:8px 16px;font-size:12px;color:var(--b)}
.empty{text-align:center;color:var(--mute);padding:30px 20px;font-size:14px;white-space:pre-line}
#nav{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;padding:8px 0;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--mute)}
#nav button b{font-size:21px;font-weight:400}
#nav .on{color:var(--ink)}#nav .on b{filter:drop-shadow(0 0 6px var(--a))}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#chat{flex:1;display:flex;flex-direction:column;min-height:0}
#ch{display:flex;gap:12px;align-items:center;padding:10px 14px;position:relative}
#ch .t{flex:1;min-width:0}#ch .t b{display:block}#ch .t span{font-size:12px;color:var(--mute)}
#msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.m{max-width:min(78%,520px);padding:8px 12px;border-radius:var(--r);background:rgba(9,20,13,.95);align-self:flex-start;border-end-start-radius:4px;word-break:break-word;white-space:pre-wrap;font-size:var(--fs);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.m.me{align-self:flex-end;background:var(--me);border-end-start-radius:var(--r);border-end-end-radius:4px}
.m.hold{animation:hold 1s linear forwards}
@keyframes hold{to{box-shadow:0 0 0 3px var(--b);transform:scale(.97)}}
.m .n{font-size:12px;color:var(--b);font-weight:600;display:block}
.m img{max-width:100%;max-height:300px;border-radius:12px;display:block;margin:4px 0;cursor:zoom-in}
.m a.f{display:flex;gap:8px;align-items:center;text-decoration:underline;color:var(--ink)}
.m a.lk{display:inline;direction:ltr;unicode-bidi:embed;word-break:break-all;text-decoration:underline;color:#86efac}
.m time{font-size:10px;opacity:.6;display:block;text-align:end}
#emo{display:flex;gap:2px;overflow:auto;padding:6px 10px}#emo button{font-size:24px;padding:4px 6px;border-radius:10px}
#bar{display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
#bar textarea{resize:none;max-height:120px;height:44px;border-radius:22px}
#ph{flex:1;display:grid;place-items:center;color:var(--mute);text-align:center}
.menu{position:absolute;top:56px;inset-inline-start:12px;min-width:200px;border-radius:16px;padding:6px;z-index:20;background:#07110a;box-shadow:0 16px 50px rgba(0,0,0,.5)}
.menu button{display:block;width:100%;text-align:start;padding:11px 14px;border-radius:10px}
.menu button:hover{background:rgba(255,255,255,.09)}
.modal{position:fixed;inset:0;background:#000;display:grid;place-items:stretch;z-index:50;padding:0}
.modal .box{width:100%;max-width:none;height:100%;max-height:100%;padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,calc((100vw - 720px)/2)) calc(24px + env(safe-area-inset-bottom,0px));border-radius:0;border:0;display:flex;flex-direction:column;gap:12px;overflow:auto;background:#050c07}
.modal h3{text-align:center}
.err{color:#ff7d9a;font-size:13px;min-height:16px;text-align:center}
.mut{color:var(--mute);font-size:13px;text-align:center}
.ths{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.th{width:54px;height:54px;border-radius:14px;background:center/cover rgba(255,255,255,.08);position:relative;cursor:pointer;border:2px solid transparent}
.th.on{border-color:var(--b)}
.th i{position:absolute;top:-7px;inset-inline-end:-7px;background:#e11d48;color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;display:grid;place-items:center;font-style:normal}
.hdr{display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.sw{height:56px;border-radius:14px;font-size:12px;font-weight:600;border:2px solid transparent;text-shadow:0 1px 3px rgba(0,0,0,.7);color:#fff}
.sw.on{border-color:#fff}
.card{padding:14px;border-radius:16px;background:rgba(255,255,255,.08);display:flex;flex-direction:column;gap:10px;text-align:center}
.row2{display:flex;gap:8px}.row2 .btn{flex:1;padding:10px 6px;font-size:13px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#052e16;padding:10px 18px;border-radius:14px;z-index:99}
.ib svg,#nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#send svg{transform:scaleX(-1);stroke:#fff}
.tag{font-style:normal;font-size:10px;font-weight:600;margin-inline-start:6px;padding:1px 7px;border-radius:8px;background:color-mix(in srgb,var(--a) 38%,transparent)}
.badge{margin-inline-start:auto;background:var(--me);border-radius:10px;padding:1px 9px;font-size:11px;font-weight:600}
.back{display:none}
#side{position:relative}
#splash{position:fixed;inset:0;display:grid;place-items:center;z-index:200;background:var(--bg)}
#sbar{flex-wrap:wrap;overflow:visible;gap:14px;padding:0}
.st .ring .av{border:2px solid var(--bg)}
#cs{padding:8px 12px}
.btn.dg{background:#e11d48}
.pc{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px}
.pc .ph{display:flex;gap:10px;align-items:center}.pc .ph b{display:block}.pc .ph span{font-size:12px;color:var(--mute)}
.pc .pt{white-space:pre-wrap;word-break:break-word;font-size:var(--fs)}
.pc .pimg{min-height:40px}.pc .pimg img{width:100%;max-height:420px;object-fit:cover;border-radius:14px;display:block;cursor:zoom-in}
.pbar{display:flex;gap:6px;align-items:center;border-top:1px solid var(--line);padding-top:6px}
.pa{display:flex;gap:6px;align-items:center;padding:6px 10px;border-radius:12px;color:var(--mute);font-size:13px}
.pa:hover{background:rgba(255,255,255,.08)}.pa.on{color:#ff4d6d}.pa.on svg{fill:#ff4d6d}.pa.mo{padding:6px}
.pi{display:inline-flex;width:22px;height:22px;font-style:normal;color:var(--mute)}.pi svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pa .pi{color:inherit}
.cmt{display:flex;gap:10px;align-items:flex-start;padding:6px 2px}.cmt .ut{white-space:pre-wrap;word-break:break-word;font-size:14px}
body.light .pc{background:rgba(255,255,255,.7)}body.light .pa:hover{background:rgba(0,0,0,.06)}
html[dir=ltr] #back,html[dir=ltr] .hdr>.ib{transform:scaleX(-1)}
html[dir=ltr] #send svg{transform:none}
html[dir=ltr] body{font-family:Vazirmatn,system-ui,sans-serif}
.menu.attm{top:auto;bottom:72px;inset-inline-start:12px}
.au{min-width:220px}.au audio{width:240px;max-width:100%;display:block;margin-top:4px}
.pvn{font-size:12px;color:var(--mute);padding:2px 4px;line-height:1.7}
.vf{display:inline-block;vertical-align:-3px;margin-inline-start:4px;width:17px;height:17px;font-style:normal}
.vf svg{width:100%;height:100%;display:block}
#chat{position:relative}
#pin,#rp{display:flex;gap:8px;align-items:center;padding:7px 14px;font-size:13px;border-top:1px solid var(--line)}
#pin{cursor:pointer}
#pin>div,#rp>div{flex:1;min-width:0}
#pin b,#rp b{color:var(--b);display:block;font-size:12px}
#pin span,#rp span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
.m .q{border-inline-start:3px solid var(--b);padding:3px 8px;margin:2px 0 4px;background:rgba(255,255,255,.1);border-radius:8px;cursor:pointer;font-size:12.5px}
.m .q b{display:block;color:var(--b);font-size:12px}
.m .q span{opacity:.8;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.m .fw{font-size:11.5px;color:var(--b);display:block;margin-bottom:2px}
.m .rx{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.m .rc{padding:2px 8px;border-radius:12px;background:rgba(255,255,255,.12);font-size:12.5px}
.m .rc.on{background:color-mix(in srgb,var(--a) 55%,transparent)}
.m.flash{animation:fl 1.4s}
@keyframes fl{0%,60%{box-shadow:0 0 0 3px var(--b)}100%{box-shadow:none}}
.dv{align-self:center;font-size:11.5px;color:var(--mute);background:rgba(0,0,0,.28);padding:2px 12px;border-radius:12px;margin:8px 0}
.pl{min-width:210px;display:flex;flex-direction:column;gap:6px;margin:2px 0}
.po{position:relative;display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.1);overflow:hidden;text-align:start;width:100%}
.po i{position:absolute;inset-block:0;inset-inline-start:0;background:color-mix(in srgb,var(--a) 45%,transparent);transition:width .3s}
.po span,.po em{position:relative;font-style:normal}
.po.on{outline:1.5px solid var(--b)}
.ers{display:flex;justify-content:center;gap:4px}.ers button{font-size:26px;padding:4px 6px;border-radius:12px}
#dn{position:absolute;left:14px;bottom:84px;width:42px;height:42px;border-radius:50%;background:var(--panel);border:1px solid var(--line);z-index:5;font-size:18px;backdrop-filter:blur(12px)}
body.light .m:not(.me) .q,body.light .m:not(.me) .rc,body.light .po{background:rgba(0,0,0,.07)}
body.light .dv{background:rgba(0,0,0,.1)}
body.light{--bg:#eef0f7;--panel:rgba(255,255,255,.84);--line:rgba(0,0,0,.1);--ink:#1c1b29;--mute:#6b6a80}
body.light .menu,body.light .modal .box{background:#fff}
body.light input,body.light textarea{background:rgba(0,0,0,.05)}
body.light .m{background:rgba(255,255,255,.96);color:#1c1b29}
body.light .m.me{background:var(--me);color:#fff}
body.light .m.me a.f{color:#fff}
body.light .m a.f{color:inherit}
body.light .m a.lk{color:#0b6fa4}
body.light .m.me a.lk{color:#d8f5ff}
body.light .btn:not(.g){color:#fff}
body.light .btn.g{background:rgba(0,0,0,.07)}
body.light .ib:hover,body.light .menu button:hover{background:rgba(0,0,0,.06)}
body.light .card{background:rgba(0,0,0,.05)}
body.light #tabs button{background:rgba(0,0,0,.06)}
body.light #tabs .on{background:var(--me);color:#fff}
body.light .th{background-color:rgba(0,0,0,.06)}
body.light #toast{background:#333;color:#fff}
body.light .logo{background:linear-gradient(90deg,#4b3bbd,#7c5cff 50%,#0891b2);-webkit-background-clip:text;background-clip:text}
body.light .badge,body.light .tag{color:inherit}
body.light .badge{color:#fff}
.sv{--ink:#4ade80;--mute:#2fa862;color:#4ade80}
body.light .sv .btn.g{background:rgba(255,255,255,.14);color:#4ade80}
body.light .sv .sheet{background:#07110a}
.sv .sbody video{max-width:100%;max-height:100%;object-fit:contain}
.fab{position:absolute;left:16px;bottom:74px;width:54px;height:54px;border-radius:50%;background:var(--me);box-shadow:0 10px 28px rgba(0,0,0,.45);display:grid;place-items:center;z-index:15}
.fab svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.menu.fabm{top:auto;bottom:138px;inset-inline-start:auto;left:16px}
#sbar{display:flex;gap:12px;overflow-x:auto;padding:4px 12px 10px;flex:none}
#sbar:empty{display:none}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mute);cursor:pointer;width:60px;flex:none;position:relative}
.st .ring{padding:2.5px;border-radius:50%;background:var(--me)}
.st.seen .ring,.st.none .ring{background:rgba(255,255,255,.22)}
.st .ring .av{width:50px;height:50px;border:2px solid #000}
.st span{max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st .plus{position:absolute;top:34px;inset-inline-end:2px;width:20px;height:20px;border-radius:50%;background:var(--b);color:#111;font-weight:800;font-size:15px;line-height:20px;text-align:center}
.sv{position:fixed;inset:0;background:#0a0a0f;z-index:80;display:flex;flex-direction:column;max-width:520px;margin:auto;width:100%}
.sv .segs{display:flex;gap:4px;padding:10px 10px 6px}
.sv .seg{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden}
.sv .seg i{display:block;height:100%;width:0;background:#fff}
.sv .shd{display:flex;gap:10px;align-items:center;padding:6px 12px}
.sv .shd .av{width:38px;height:38px}
.sv .shd .t{flex:1}.sv .shd .t span{display:block;font-size:11px;color:var(--mute)}
.sv .sbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;position:relative}
.sv .sbody img{max-width:100%;max-height:100%;object-fit:contain}
.sv .scap{padding:14px 18px;font-size:18px;text-align:center;white-space:pre-wrap;word-break:break-word}
.sv .sft{display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.sv .sft .btn{flex:1}
.sv .sheet{position:absolute;inset-inline:0;bottom:0;max-height:70%;overflow:auto;background:#07110a;border-radius:22px 22px 0 0;padding:16px;display:flex;flex-direction:column;gap:8px;z-index:3}
.sv .sheet h3{text-align:center}
.pring{padding:2.5px;border-radius:50%;background:conic-gradient(#f09433,#e6683c,#dc2743,#cc2366,#bc1888,#f09433);display:flex;flex:none;width:max-content}
.pring.seen{background:rgba(255,255,255,.28)}.pring.none{background:transparent}
.pring .av{border:2.5px solid var(--bg)}
.tk{display:inline-flex;width:17px;height:17px;vertical-align:-4px;margin-inline-start:4px;color:rgba(255,255,255,.7)}.tk.b{color:#34b7f1}
.tk svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.m .rc svg{width:13px;height:13px;vertical-align:-2px;fill:#ff4d6d;stroke:#ff4d6d}
.tag svg{width:11px;height:11px;vertical-align:-2px;fill:none;stroke:currentColor;stroke-width:2.2}
.m .mp{display:block;position:relative;width:230px;height:200px;border-radius:12px;overflow:hidden;margin:4px 0;background:#111}
.m .mp img{width:100%;height:100%;max-height:none;margin:0;object-fit:cover;cursor:pointer}
.mpin{position:absolute;width:16px;height:16px;border-radius:50%;background:#e11d48;border:3px solid #fff;transform:translate(-50%,-50%)}
.shg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.shg img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:zoom-in}
.shf{display:block;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.07);color:var(--ink);text-decoration:none;margin-bottom:6px;word-break:break-all;font-size:13.5px}
.cl{position:fixed;inset:0;z-index:300;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--ink)}
.cl video#rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cl video#lv{position:absolute;top:16px;inset-inline-end:16px;width:110px;height:150px;object-fit:cover;border-radius:14px;border:2px solid var(--a);z-index:2;background:#000}
.cl .ci{position:relative;z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;text-shadow:0 1px 6px #000}
.cl .cb{position:relative;z-index:2;display:flex;gap:12px;margin-top:24px}
.mon{height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}.mon i{display:block;height:100%;background:linear-gradient(90deg,#16a34a,#86efac)}
#app.full #side{width:100%;border-inline-end:0}#app.full #main{display:none}
#app.full .pane{padding-inline:max(16px,calc((100vw - 760px)/2))}
@media(max-width:760px){#side{width:100%}#app.in #side{display:none}#app:not(.in) #main{display:none}.back{display:block!important}}
</style>
</head>
<body>

<div id="splash"><div class="logo">MACuan<small>CHT</small></div></div>
<div id="login" class="hide">
  <div class="card glass">

function locEl(l){
  const z=15,n=2**z,x=(l.lng+180)/360*n,la=l.lat*Math.PI/180,y=(1-Math.log(Math.tan(la)+1/Math.cos(la))/Math.PI)/2*n,tx=Math.floor(x),ty=Math.floor(y);
  const w=el('div'),a=el('a','mp');a.href='https://www.openstreetmap.org/?mlat='+l.lat+'&mlon='+l.lng+'#map=16/'+l.lat+'/'+l.lng;a.target='_blank';a.rel='noopener';
  const im=new Image();im.src='https://tile.openstreetmap.org/'+z+'/'+tx+'/'+ty+'.png';
  const pin=el('i','mpin');pin.style.left=((x-tx)*100)+'%';pin.style.top=((y-ty)*100)+'%';a.append(im,pin);
  w.append(a,el('div','mut','مکان فعلی'));
  if(l.name){const t=el('div','ut',l.name);t.style.cssText='font-size:12.5px;max-width:230px';w.append(t)}
  return w;
}
async function sendLoc(){
  if(!navigator.geolocation)return toast('مرورگر از مکان‌یابی پشتیبانی نمی‌کند');
  toast('در حال یافتن مکان...');
  navigator.geolocation.getCurrentPosition(async p=>{
    const lat=+p.coords.latitude.toFixed(5),lng=+p.coords.longitude.toFixed(5);let name='';
    try{const c=new AbortController();setTimeout(()=>c.abort(),5000);const r=await (await fetch('https://nominatim.openstreetmap.org/reverse?format=json&zoom=16&accept-language='+LANG+'&lat='+lat+'&lon='+lng,{signal:c.signal})).json();name=(r.display_name||'').slice(0,160)}catch(e){}
    post({loc:{lat,lng,name}}).catch(()=>toast('ارسال نشد'));
  },()=>toast('دسترسی به مکان داده نشد'),{enableHighAccuracy:true,timeout:15000});
}

async function lookup(q){
  q=(q||'').trim().replace(/^@/,'');
  const ph=normPhone(q);
  if(/^[\d۰-۹+\s-]{7,}$/.test(q)&&ph.length>=7)return (await get(ref(db,'phones/'+ph))).val()||null;
  const un=clean(q);return un?((await get(ref(db,'usernames/'+un))).val()||null):null;
}

function openStory(id,start,ovr){
  const list=ovr||storyData[id]||[];if(!list.length)return;
  const mine=canManageStory(id);let i=start>=0?start:Math.max(0,list.findIndex(s=>!seenS[id+'/'+s.k])),tm,tok=0;
  const w=el('div','sv'),segs=el('div','segs'),hd=el('div','shd'),body=el('div','sbody'),ft=el('div','sft');
  w.append(segs,hd,body,ft);document.body.append(w);
  const close=()=>{tok++;clearTimeout(tm);w.remove();renderStories()};
  const media=async s=>{if(!s.type||s.type==='text')return null;const k=id+'/'+s.k;return mcache[k]||(mcache[k]=(await get(ref(db,'storyMedia/'+id+'/'+s.k))).val())};
  const viewers=async s=>{
    tok++;clearTimeout(tm);w.querySelectorAll('video').forEach(v=>v.pause());
    const v=(await get(ref(db,'storyViews/'+id+'/'+s.k))).val()||{},ids=Object.keys(v).sort((a,b)=>v[b]-v[a]);
    const sh=el('div','sheet');sh.append(el('h3',null,'بازدیدکنندگان ('+ids.length+')'));
    for(const k of ids){const u=await getUser(k),r=el('div','row'),a=el('div','av'),t=el('div');setAv(a,u.photo,u.name);
      t.append(el('b',null,u.name||''),el('span',null,new Date(v[k]).toLocaleTimeString(LOC,{hour:'2-digit',minute:'2-digit'})));r.append(a,t);sh.append(r)}
    if(!ids.length)sh.append(el('div','empty','هنوز کسی ندیده است'));
    const c=el('button','btn g','بستن');c.onclick=()=>{sh.remove();show(i)};sh.append(c);w.append(sh);
  };
  const show=async j=>{
    clearTimeout(tm);const my=++tok;
    if(j<0)j=0;if(j>=list.length)return close();
    i=j;const s=list[j];
    seenS[id+'/'+s.k]=1;try{localStorage.setItem('mc_seen',JSON.stringify(seenS))}catch(e){}
    if(!mine)set(ref(db,'storyViews/'+id+'/'+s.k+'/'+uid),Date.now()).catch(()=>{});
    segs.innerHTML='';
    const fills=list.map((x,k)=>{const sg=el('div','seg'),f=el('i');if(k<j)f.style.width='100%';sg.append(f);segs.append(sg);return f});
    const prog=sec=>{const f=fills[j];f.style.transition='width '+sec+'s linear';requestAnimationFrame(()=>requestAnimationFrame(()=>f.style.width='100%'))};
    hd.innerHTML='';const av=el('div','av'),t=el('div','t'),x=el('button','ib','✕');x.onclick=close;
    const nm=el('b',null,'...');t.append(nm,el('span',null,new Date(s.ts).toLocaleTimeString(LOC,{hour:'2-digit',minute:'2-digit'})));
    if(chats[id]){setAv(av,chats[id].photo,chats[id].name);nm.textContent=chats[id].name}
    else if(id===uid){setAv(av,me.photo,me.name);nm.textContent='استوری من'}
    else getUser(id).then(u=>{setAv(av,u.photo,u.name);nm.textContent=u.name||''});
    hd.append(av,t,x);
    body.innerHTML='';ft.innerHTML='';
    body.onclick=e=>{const r=body.getBoundingClientRect();(e.clientX-r.left<r.width/3)?show(i-1):show(i+1)};
    if(mine){
      const vb=el('button','btn g','بازدیدها');
      get(ref(db,'storyViews/'+id+'/'+s.k)).then(v=>{vb.textContent=''+Object.keys(v.val()||{}).length+' بازدید'}).catch(()=>{});
      vb.onclick=()=>viewers(s);
      const del=el('button','btn g','حذف');
      del.onclick=async()=>{if(!confirm('این استوری حذف شود؟'))return;await update(ref(db),{['stories/'+id+'/'+s.k]:null,['storyMedia/'+id+'/'+s.k]:null,['storyViews/'+id+'/'+s.k]:null});close()};
      ft.append(vb,del);
    }
    let data=null;
    if(s.type==='img'||s.type==='video'){
      body.append(el('div','mut','در حال بارگذاری...'));
      data=await media(s).catch(()=>null);if(my!==tok)return;body.innerHTML='';
    }
    if(s.type==='video'&&data){
      const v=document.createElement('video');v.src=data;v.playsInline=true;v.controls=false;
      v.onloadedmetadata=()=>prog(v.duration||10);v.onended=()=>show(j+1);v.onerror=()=>show(j+1);

function callStatus(t){if(call&&call.ui)call.ui.st.textContent=t}
function callConnected(){
  if(!call||call.connected)return;call.connected=true;clearTimeout(call.timeout);call.t0=Date.now();
  if(call.type==='video')call.ui.info.style.display='none';
  call.tm=setInterval(()=>{const s=Math.floor((Date.now()-call.t0)/1000);callStatus(String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'))},1000);
}
function mkPc(stream,iceRef){
  const pc=new RTCPeerConnection(ICE);
  stream.getTracks().forEach(t=>pc.addTrack(t,stream));
  pc.ontrack=e=>{const rv=call&&call.ui&&call.ui.rv;if(rv){rv.srcObject=e.streams[0];rv.play().catch(()=>{})}};
  pc.onicecandidate=e=>{if(e.candidate)push(iceRef,e.candidate.toJSON()).catch(()=>{})};
  pc.onconnectionstatechange=()=>{if(pc.connectionState==='connected')callConnected();else if(pc.connectionState==='failed'){toast('اتصال تماس برقرار نشد');endCall(true)}};
  return pc;
}
async function getMedia(type){
  if(!navigator.mediaDevices||!window.RTCPeerConnection){toast('مرورگر از تماس پشتیبانی نمی‌کند');return null}
  try{return await navigator.mediaDevices.getUserMedia({audio:true,video:type==='video'})}catch(e){toast('دسترسی به میکروفون یا دوربین داده نشد');return null}
}
async function startCall(o,type){
  if(!o||o===uid)return;if(call)return toast('در حال تماس هستید');
  const er=await dmAllowed(o);if(er)return toast(er);
  const stream=await getMedia(type);if(!stream)return;
  const node=ref(db,'calls/'+o),u=await getUser(o);
  call={stream,peer:o,type,node,role:'caller',offs:[]};
  const pc=mkPc(stream,ref(db,'calls/'+o+'/icc'));call.pc=pc;callView(u.name,u.photo,type);
  try{
    const offer=await pc.createOffer();
    await set(node,{from:uid,type,ts:Date.now(),status:'ringing',offer:{type:offer.type,sdp:offer.sdp}});
    await pc.setLocalDescription(offer);
  }catch(e){toast('شروع تماس ممکن نشد');endCall(false);return}
  callStatus('در حال زنگ خوردن...');
  call.offs.push(onValue(node,s=>{
    const v=s.val();if(!call||call.node!==node)return;
    if(!v||v.status==='ended'||v.status==='declined'){toast(v&&v.status==='declined'?'تماس رد شد':'تماس پایان یافت');endCall(false);return}
    if(v.answer&&!call.answered){call.answered=true;callStatus('در حال اتصال...');pc.setRemoteDescription(v.answer).catch(()=>{})}
  }));
  call.offs.push(onChildAdded(ref(db,'calls/'+o+'/ice'),s=>{pc.addIceCandidate(s.val()).catch(()=>{})}));
  call.timeout=setTimeout(()=>{if(call&&!call.connected){toast('پاسخی داده نشد');endCall(true)}},45000);
}
async function acceptCall(v,u){
  closeIncoming();if(call)return;
  const stream=await getMedia(v.type);
  if(!stream){update(ref(db,'calls/'+uid),{status:'declined'}).catch(()=>{});return}
  const node=ref(db,'calls/'+uid);
  call={stream,peer:v.from,type:v.type,node,role:'callee',offs:[]};
  const pc=mkPc(stream,ref(db,'calls/'+uid+'/ice'));call.pc=pc;callView(u.name,u.photo,v.type);callStatus('در حال اتصال...');
  try{
    await pc.setRemoteDescription(v.offer);
    const ans=await pc.createAnswer();await pc.setLocalDescription(ans);
    await update(node,{answer:{type:ans.type,sdp:ans.sdp},status:'accepted'});
  }catch(e){toast('اتصال تماس برقرار نشد');endCall(true);return}
  call.offs.push(onChildAdded(ref(db,'calls/'+uid+'/icc'),s=>{pc.addIceCandidate(s.val()).catch(()=>{})}));
  call.timeout=setTimeout(()=>{if(call&&!call.connected){endCall(true)}},30000);
}
function endCall(notify){
  const c=call;if(!c)return;call=null;
  clearTimeout(c.timeout);clearInterval(c.tm);c.offs.forEach(f=>{try{f()}catch(e){}});
  try{c.pc.close()}catch(e){}
  c.stream.getTracks().forEach(t=>t.stop());
  const w=$('callUI');if(w)w.remove();
  if(notify)update(c.node,{status:'ended'}).catch(()=>{});
  if(c.role==='caller')setTimeout(()=>remove(c.node).catch(()=>{}),1500);
}

function memberList(b,close,d){
  const ids=Object.keys(d.members||{}).slice(0,500),sub=el('div','mut','در حال بارگذاری...');
  const q=field(b,'جست‌وجو در اعضا'),L=el('div');
  b.insertBefore(sub,q);
  L.style.cssText='display:flex;flex-direction:column;gap:2px;overflow:auto;min-height:60px;max-height:320px';b.append(L);
  let rows=[];
  const rank=i=>d.owner===i?0:(d.admins&&d.admins[i])?1:2;
  const seen=p=>p==='hidden'?'آخرین بازدید به‌تازگی':p===true?'آنلاین':typeof p==='number'?'آخرین بازدید: '+new Date(p).toLocaleString(LOC,{dateStyle:'short',timeStyle:'short'}):'مدت‌ها پیش';
  const draw=()=>{
    const f=q.value.trim().toLowerCase().replace(/^@/,'');L.innerHTML='';
    rows.filter(r=>!f||(r.u.name||'').toLowerCase().includes(f)||(r.u.username||'').includes(f)||(staff(d)&&r.po&&(r.u.phone||'').includes(f))).forEach(({i,u,p,po,fo})=>{
      const r=el('div','row'),a=el('div','av');setAv(a,fo?u.photo:'',u.name);
      const t=el('div'),bn=el('b',null,u.name||''),role=rank(i)===0?'مالک':rank(i)===1?'مدیر':'';
      if(role)bn.append(el('i','tag',role));
      if(isVer(i))bn.append(vbadge());
      const info=[seen(p)];if(u.username)info.push('@'+u.username);if(staff(d)&&u.phone&&po)info.push(u.phone);
      const sp=el('span',null,info.join(' • '));if(p===true)sp.style.color='var(--b)';
      t.append(bn,sp);r.append(a,t);r.onclick=()=>{close();userModal(i,u)};L.append(r);
    });
    if(!L.children.length)L.append(el('div','empty','عضوی پیدا نشد'));
  };
  q.oninput=draw;
  Promise.all(ids.map(i=>getUser(i).then(async u=>{const [so,po,fo]=await Promise.all([allowed(u,i,'seen'),allowed(u,i,'phone'),allowed(u,i,'photo')]);return [u,so?await get(ref(db,'presence/'+i)).then(s=>s.val()).catch(()=>null):'hidden',po,fo]}))).then(res=>{
    rows=res.map(([u,p,po,fo],k)=>({i:ids[k],u,p,po,fo}));
    rows.sort((a,c)=>rank(a.i)-rank(c.i)||((c.p===true)-(a.p===true))||((typeof c.p==='number'?c.p:0)-(typeof a.p==='number'?a.p:0)));
    sub.textContent=ids.length+' عضو، '+rows.filter(r=>r.p===true).length+' آنلاین';draw();
  });
}

async function loadShared(o,box){
  const cid=[uid,o].sort().join('_');let v={};
  try{v=(await get(query(ref(db,'messages/'+cid),limitToLast(120)))).val()||{}}catch(e){return}
  const ms=Object.values(v).sort((a,c)=>c.ts-a.ts),im=ms.filter(m=>m.img),fl=ms.filter(m=>m.file||m.audio);
  if(im.length){
    box.append(el('div','sec','عکس‌ها ('+im.length.toLocaleString(LOC)+')'));const gr=el('div','shg');
    im.slice(0,30).forEach(m=>{const t=new Image();t.src=m.img;t.onclick=()=>{const w=window.open();if(w)w.document.write('<img style="max-width:100%" src="'+m.img+'">')};gr.append(t)});box.append(gr);
  }
  if(fl.length){
    box.append(el('div','sec','فایل‌ها ('+fl.length.toLocaleString(LOC)+')'));
    fl.slice(0,30).forEach(m=>{const f=m.file||m.audio,a=el('a','shf',f.name);a.href=f.data;a.download=f.name;box.append(a)});
  }
}
function userModal(i,u){

      act('گزارش کاربر',()=>reportModal('user',i,u.name),true);
    }

const PUNL=/^[()«»:.,،؛؟?!…•—＋@"'\[\]-]+/,PUNT=/[()«»:.,،؛؟?!…•—"'\[\]-]+$/;
function trText(s){
  if(LANG==='fa'||!s||!/[؀-ۿ]/.test(s))return s;
  const parts=s.split(/(\s+)/),W=[],S2=[];
  parts.forEach((p,i)=>{if(i%2===0){if(p!=='')W.push(p)}else if(W.length)S2.push(p)});
  let out='',hit=false,i=0;
  while(i<W.length){
    let done=false;
    for(let n=Math.min(22,W.length-i);n>=1&&!done;n--){
      let ok=true;for(let k=i;k<i+n-1;k++)if(S2[k]!==' '){ok=false;break}
      if(!ok)continue;
      const raw=W.slice(i,i+n).join(' '),lead=(raw.match(PUNL)||[''])[0],r1=raw.slice(lead.length),trail=(r1.match(PUNT)||[''])[0],core=r1.slice(0,r1.length-trail.length);
      const t=EN[core];
      if(t!==undefined){out+=lead+t+trail;hit=true;i+=n;done=true;if(i<W.length)out+=(S2[i-1]??' ')}
    }
    if(!done){out+=W[i];if(i<W.length-1)out+=(S2[i]??' ');i++}
  }
  if(!hit)return s;
  return out.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/،/g,',').replace(/؛/g,';').replace(/؟/g,'?').replace(/٪/g,'%');
}
if(LANG!=='fa'){
  const okEl=n=>{const p=n.parentNode;if(!p||p.nodeType!==1)return false;const t=p.nodeName;if(t==='SCRIPT'||t==='STYLE'||t==='TEXTAREA'||t==='INPUT')return false;if(p.closest('.ut'))return false;const m=p.closest('.m');return !m||p.matches('time,.fw,.mut,.rc,.po em,a.f')};
  const doNode=n=>{
    if(n.nodeType===3){if(!okEl(n))return;const t=trText(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t;return}
    if(n.nodeType!==1||n.nodeName==='SCRIPT'||n.nodeName==='STYLE')return;
    ['placeholder','title'].forEach(a=>{const v=n.getAttribute&&n.getAttribute(a);if(v){const t=trText(v);if(t!==v)n.setAttribute(a,t)}});
    n.childNodes.forEach(doNode);
  };
  const _confirm=window.confirm.bind(window);window.confirm=m=>_confirm(trText(m));
  doNode(document.body);
  new MutationObserver(ms=>ms.forEach(m=>{
    if(m.type==='characterData')doNode(m.target);
    else if(m.type==='attributes'){const v=m.target.getAttribute(m.attributeName);if(v){const t=trText(v);if(t!==v)m.target.setAttribute(m.attributeName,t)}}
    else m.addedNodes.forEach(doNode);
  })).observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder','title']});
}
